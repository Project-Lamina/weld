[package]
name = "lamina-weld"
version = "0.1.0"
edition = "2024"
description = "Cross-platform linker for Lamina. Fast, minimal, drop-in for ld/lld/mold."

[[bin]]
name = "weld"
path = "src/main.rs"

[dev-dependencies]
lamina-platform = { path = "../lamina-platform", version = "0.1.0" }
ras = { package = "lamina-ras", path = "../ras", version = "0.1.0", features = ["encoder"] }
